name: Mantenimiento del sitio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["solicitudes/mantenimiento.json"]

concurrency:
  group: mantenimiento
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mantenimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ejecutar
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: cd scripts && python mantenimiento.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "gyms52-bot"
          git config user.email "bot@gyms52.com"
          git add data/mantenimiento
          git commit -m "Mantenimiento: bitácora" || echo "Sin cambios"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep 15; done
