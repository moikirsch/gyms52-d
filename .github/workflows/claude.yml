name: Aplicar lo que encontró Claude

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/claude/*.csv", "solicitudes/claude.json"]

concurrency:
  group: claude
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # lo más reciente, no el commit que disparó la corrida (puede venir en cola)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aplicar, subir y guardar (reintenta si otra corrida cambió la base)
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          git config user.name "gyms52-bot"
          git config user.email "bot@gyms52.com"
          mkdir -p data/corridas
          for intento in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd scripts && python aplicar_claude.py && python publicar.py --actualizar --max 2000 && python publicar.py --retirar) 2>&1 | grep -v -i deprecat | tee data/corridas/ultima-claude.log
            git add data
            git commit -qm "Enriquecimiento de Claude aplicado" || { echo "Sin cambios"; break; }
            if git push -q origin main; then break; fi
            echo "La base cambió mientras tanto; reintento $intento"
            sleep $((intento * 20))
          done
