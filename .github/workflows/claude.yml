name: Aplicar lo que encontró Claude

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/claude/*.csv", "solicitudes/claude.json"]

concurrency:
  group: claude
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # lo más reciente, no el commit que disparó la corrida (puede venir en cola)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aplicar lo de Claude
        run: |
          mkdir -p data/corridas
          cd scripts && python aplicar_claude.py 2>&1 | tee ../data/corridas/ultima-claude.log
      - name: Subir a WordPress
        if: always()
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          cd scripts
          python publicar.py --actualizar --max 2000 2>&1 | tee -a ../data/corridas/ultima-claude.log
          python publicar.py --retirar 2>&1 | tee -a ../data/corridas/ultima-claude.log
      - name: Guardar (reintenta si la base cambió)
        if: always()
        shell: bash {0}
        run: |
          git config user.name "gyms52-bot"
          git config user.email "bot@gyms52.com"
          git add data
          git commit -qm "Enriquecimiento de Claude aplicado" || exit 0
          for intento in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin main && git push -q origin main && exit 0
            git rebase --abort 2>/dev/null
            echo "reintento $intento"; sleep $((intento * 15))
          done
          exit 1
