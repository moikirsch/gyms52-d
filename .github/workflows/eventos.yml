name: Página de eventos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/eventos/eventos.csv", "solicitudes/eventos.json"]

concurrency:
  group: datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eventos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publicar eventos
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          mkdir -p data/corridas
          cd scripts && python eventos.py 2>&1 | tee ../data/corridas/ultima-eventos.log
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "gyms52-bot"
          git config user.email "bot@gyms52.com"
          git add data
          git commit -m "Eventos publicados" || echo "Sin cambios"
          git pull --rebase origin main && git push
