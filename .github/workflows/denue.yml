name: Actualizar DENUE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 15 1,7 *"   # 15 de enero y 15 de julio

concurrency:
  group: datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  denue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # lo más reciente, no el commit que disparó la corrida (puede venir en cola)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cd scripts && python denue.py
      - run: |
          git config user.name "gyms52-bot"
          git config user.email "bot@gyms52.com"
          git add data/denue
          git commit -m "DENUE actualizado" || echo "Sin cambios"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep 15; done
