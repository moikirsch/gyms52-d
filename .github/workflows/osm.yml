name: OpenStreetMap y DENUE (gratis)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 10 * * 1"   # lunes 4:41 am
  push:
    branches: [main]
    paths: ["solicitudes/osm.json"]

concurrency:
  group: datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # lo más reciente, no el commit que disparó la corrida (puede venir en cola)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Descargar OpenStreetMap
        run: |
          mkdir -p data/corridas
          METROS=$(jq -r '.metros // ""' solicitudes/osm.json 2>/dev/null || echo "")
          cd scripts && python osm.py --metros "$METROS" 2>&1 | tee ../data/corridas/ultima-osm.log
      - name: Unir
        if: always()
        run: cd scripts && python unir.py 2>&1 | tee ../data/corridas/ultima-unir.log
      - name: Guardar base antes de publicar
        if: always()
        run: |
          git config user.name "gyms52-bot"
          git config user.email "bot@gyms52.com"
          git add data && git commit -m "OSM y DENUE: base unida" || echo "Sin cambios"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep 15; done
      - name: Publicar lo nuevo y actualizar lo completado
        if: always()
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          # en tandas de 800 y guardando cada tanda, para no perder los ids si el trabajo se corta
          git config user.name "gyms52-bot"
          git config user.email "bot@gyms52.com"
          cd scripts
          for t in $(seq 1 15); do
            python publicar.py --max 800 2>&1 | tee -a ../data/corridas/ultima-publicar.log
            cd ..
            git add data && (git commit -qm "Publicación OSM y DENUE, tanda $t" || true)
            if ! (git pull -q --rebase -X theirs origin main && git push -q || (git rebase --abort 2>/dev/null; sleep 15; git pull -q --rebase -X theirs origin main && git push -q)); then
              git rebase --abort 2>/dev/null || true
              echo "No se pudo guardar la tanda $t; se detiene para no publicar de nuevo lo mismo" | tee -a data/corridas/ultima-publicar.log
              cd scripts && break
            fi
            cd scripts
            if tail -3 ../data/corridas/ultima-publicar.log | grep -q "Publicados: 0 "; then break; fi
          done
          python publicar.py --actualizar --max 5000 2>&1 | tee -a ../data/corridas/ultima-publicar.log
          python publicar.py --retirar 2>&1 | tee -a ../data/corridas/ultima-publicar.log
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "gyms52-bot"
          git config user.email "bot@gyms52.com"
          git add data
          git commit -m "OSM y DENUE: publicación" || echo "Sin cambios"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep 15; done
